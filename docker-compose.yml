version: '3.8'

services:
  adult-search-downloader:
    build: .
    container_name: adult-search-downloader
    restart: unless-stopped
    network_mode: "container:qbt-vpn"  # Use qbt-vpn's network (Tailscale → Mullvad)
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOWNLOAD_DIR=/downloads
      - DB_PATH=/config/searches.db
      - GALLERY_DL_ARCHIVE=/config/archive.sqlite3
    volumes:
      - ${DOCKERDIR}/appdata/adult-search-downloader:/config
      - ${MEDIADIR3}/gallery-dl:/downloads
    # No ports section - using qbt-vpn's network, access via its IP
    profiles:
      - media
      - adult
      - all
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - qbt-vpn
